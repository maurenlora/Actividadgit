<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex - Iniciar sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="h1">Apex</h1>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar entre modo claro y oscuro">Modo claro</button>
  </header>

  <main class="main">
    <div class="error" id="message-box" role="alert" hidden>
      <h3 id="error-message"></h3>
    </div>

    <section class="section">
      <h2>Iniciar sesión</h2>

      <div class="imagenes">
        <a href="#" aria-label="Ingresar con Gmail"><img src="img/gmail.svg" alt="Gmail" /></a>
        <a href="#" aria-label="Ingresar con Facebook"><img src="img/facebook.svg" alt="Facebook" /></a>
        <a href="#" aria-label="Ingresar con Twitter"><img src="img/twitter.svg" alt="Twitter" /></a>
      </div>

      <form id="login-form" novalidate>
        <div class="input">
          <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username" />
          <small class="field-error" id="email-error"></small>

          <div class="password-wrap">
            <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" />
            <button type="button" id="toggle-password" class="eye" aria-label="Mostrar u ocultar contraseña">Ver</button>
          </div>
          <small class="field-error" id="password-error"></small>
        </div>

        <div class="checkbox">
          <input type="checkbox" name="recordar" id="recordar" />
          <label class="label" for="recordar">Recordar mi correo</label>
        </div>

        <button type="submit" id="login-btn" class="btn-login">INICIAR SESIÓN</button>
      </form>

      <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
      <p class="hint">Usuario de prueba: usuario@example.com / contrasena</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
